[package]
name = "podpull"
version = "2.0.2"
edition = "2024"
authors = ["Jakob Westhoff <jakob@westhoffswelt.de>"]
license = "MPL-2.0"
description = "A fast, minimal CLI tool for downloading and synchronizing podcasts from RSS feeds"
repository = "https://github.com/jakobwesthoff/podpull"
homepage = "https://podpull.westhoffswelt.de"
keywords = ["podcast", "rss", "download", "sync", "backup"]
categories = ["command-line-utilities", "multimedia"]
# Repository tooling, the docs (ADRs, the project website and its demo
# recording) and todos are of no use in the published crate. CLAUDE.md is
# a local, untracked file.
exclude = [".adr-dir", ".github/", "CLAUDE.md", "docs/", "todos/"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
bytes = "1.12.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
console = "0.16.6"
futures = "0.3.34"
html-escape = "0.2.15"
indicatif = "0.18.6"
libc = "0.2.190"
reqwest = { version = "0.13.5", features = ["stream"] }
rss = "2.1.2"
sanitize-filename = "0.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "fs"] }
unicode-normalization = "0.1.25"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["time", "macros", "rt-multi-thread"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
